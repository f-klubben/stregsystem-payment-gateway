services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    image: wordpress:7.1.5-php8.3-apache
    restart: unless-stopped
    ports:
      # Only reachable from the host; put a TLS-terminating reverse proxy in front
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
        define('SAVEQUERIES', false);
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_html:/var/www/html
      - wp_content:/var/www/html/wp-content
      - ./stregsystem-payment-gateway:/var/www/html/wp-content/plugins/stregsystem-payment-gateway:ro
      - ./foocommerce:/opt/foocommerce:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # wp-cli, for setup.sh and the occasional maintenance command:
  #   docker compose run --rm cli wp plugin list
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
    volumes:
      - wp_html:/var/www/html
      - wp_content:/var/www/html/wp-content
      - ./stregsystem-payment-gateway:/var/www/html/wp-content/plugins/stregsystem-payment-gateway:ro
      - ./foocommerce:/opt/foocommerce:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - default

networks:
  backend:
    internal: true

volumes:
  db_data:
    external: true
    name: wp_db_data
  wp_content:
    external: true
    name: wp_wp_content
  wp_html:
    external: true
    name: wp_html
